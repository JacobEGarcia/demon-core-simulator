<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demon Core Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9e7e2;color:#1c2026;font-family:"Space Grotesk",-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 18px;user-select:none}
h1{font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.sub{color:#757a82;font-size:11px;letter-spacing:.16em;margin-top:8px;text-transform:uppercase;text-align:center}
#lab{position:relative;width:min(460px,92vw);height:300px;margin:24px 0;background:radial-gradient(circle at 50% 60%,#d8dadc,#b4b7bb 75%);border:1px solid #8a8e94;border-radius:8px;overflow:hidden;box-shadow:0 12px 28px rgba(28,32,38,.16)}
#lab::before{content:'';position:absolute;top:0;left:0;right:0;height:8px;background:repeating-linear-gradient(45deg,#d9a514 0 16px,#1c2026 16px 32px)}
#core{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:66px}
#glow{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(90,160,255,.35),transparent 70%);transition:background .3s}
#shell{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:52px;transition:top .35s ease,transform .35s ease}
#readout{display:flex;gap:22px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:#5a6068;letter-spacing:.08em;margin-bottom:14px;flex-wrap:wrap;justify-content:center;text-transform:uppercase}
#readout b{color:#1c2026;font-weight:600}
#readout .danger{color:#c23b2e}
#actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(460px,92vw)}
button{cursor:pointer;background:#fff;border:1px solid #b9bcc0;border-radius:6px;color:#1c2026;font-family:"Space Grotesk",sans-serif;font-size:11px;font-weight:500;padding:13px 16px;letter-spacing:.08em;text-transform:uppercase;transition:.15s}
button:hover:not(:disabled){border-color:#1c2026}
button:disabled{opacity:.35;cursor:not-allowed}
#msg{margin-top:16px;font-size:12.5px;color:#5a6068;text-align:center;min-height:20px;width:min(460px,92vw);line-height:1.7;font-style:italic}
#hud{margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#5a6068;letter-spacing:.12em;text-transform:uppercase}
#hud b{color:#b8860b;font-weight:600}
</style>
</head>
<body>
<h1>Demon Core</h1>
<div class="sub">tickle the dragon's tail. measure neutron flux. don't slip.</div>
<div id="lab">
  <div id="glow"></div>
  <div id="core">&#9883;&#65039;</div>
  <div id="shell">&#128297;</div>
</div>
<div id="readout">
  <span>Neutron flux <b id="flux">12</b></span>
  <span>Reflector <b id="gap">OPEN</b></span>
  <span>Steadiness <b id="steady">100%</b></span>
</div>
<div id="actions">
  <button id="lower">Lower reflector</button>
  <button id="raise">Raise reflector</button>
  <button id="measure">Measure (in sweet spot)</button>
</div>
<div id="msg">lower the beryllium shell to raise reactivity. measure in the sweet spot (flux 80-95). overshoot and it's 1946 again.</div>
<div id="hud">Good measurements <b id="good">0</b>/8</div>
<script>
const S={gap:100,steady:100,flux:12,good:0,over:false};
const $=id=>document.getElementById(id);
const shell=$('shell');
function render(){
  shell.style.top=(38-(100-S.gap)*0.22)+'%';
  shell.style.transform='translateX(-50%) rotate('+((100-S.gap)*0.6)+'deg)';
  const f=S.flux;
  $('flux').textContent=f;
  $('flux').className=f>95?'danger':'';
  $('gap').textContent=S.gap>60?'OPEN':S.gap>25?'HALF':'CLOSED';
  $('steady').textContent=S.steady+'%';
  $('good').textContent=S.good;
  const glow=$('glow');
  glow.style.background=f>95?'radial-gradient(circle,rgba(255,94,77,.6),transparent 70%)':f>80?'radial-gradient(circle,rgba(90,212,255,.55),transparent 70%)':'radial-gradient(circle,rgba(90,160,255,'+(f/300)+'),transparent 70%)';
}
setInterval(()=>{
  if(S.over)return;
  const target=12+(100-S.gap)*1.1;
  S.flux=Math.max(8,Math.round(S.flux+(target-S.flux)*0.25+(Math.random()*6-3)));
  if(S.flux>95){S.steady-=Math.round(2+(S.flux-95)*0.5);}
  else if(S.steady<100&&S.flux<60)S.steady=Math.min(100,S.steady+1);
  if(S.steady<=0||S.flux>160)return end();
  render();
},250);
$('lower').onclick=()=>{if(S.over)return;S.gap=Math.max(0,S.gap-8);$('msg').textContent='shell lowered by hand, with a screwdriver, because safety culture is optional.';render();};
$('raise').onclick=()=>{if(S.over)return;S.gap=Math.min(100,S.gap+8);$('msg').textContent='shell raised. the room exhales.';render();};
$('measure').onclick=()=>{
  if(S.over)return;
  if(S.flux>=80&&S.flux<=95){
    S.good++;
    $('msg').textContent='measurement '+S.good+'/8 logged. Louis would be proud, and also concerned.';
    if(S.good>=8){$('msg').textContent='EIGHT CLEAN MEASUREMENTS. The dragon purrs. You publish. Legend.';$('core').textContent='🏆';S.over=true;}
  }else if(S.flux<80){$('msg').textContent='flux too low to measure ('+S.flux+'). lower the shell. carefully.';}
  else{$('msg').textContent='TOO HOT. flux '+S.flux+'. raise it NOW.';S.steady-=12;}
  render();
};
function end(){
  S.over=true;
  $('core').textContent='💥';
  $('glow').style.background='radial-gradient(circle,rgba(255,220,120,.9),transparent 75%)';
  $('msg').textContent='BLUE FLASH. The screwdriver slips from history. Flux peaked at '+S.flux+'. The lab will be discussed in safety seminars forever.';
}
render();
</script>
</body>
</html>
